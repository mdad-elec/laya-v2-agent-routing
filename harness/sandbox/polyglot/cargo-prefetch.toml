[package]
name = "prefetch"
version = "0.1.0"
edition = "2021"

# The union of the Rust exercises' dependencies at polyglot-benchmark 7e0611e7 (stubs: grep,
# simple-cipher, gigasecond; references: .meta/Cargo-example.toml). Two rand majors, so renamed.
[dependencies]
anyhow = "1.0"
rand08 = { package = "rand", version = "0.8" }
rand03 = { package = "rand", version = "0.3.12" }
time = "0.3"
counter = "0.5.2"
itertools = "0.5"
num-bigint = "0.4.4"
num-traits = "0.2.16"
permutohedron = "0.2"
regex = "0.2"
thiserror = "1.0"
